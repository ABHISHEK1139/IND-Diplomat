[pytest]
markers =
    unit: Fast unit tests with no external dependencies
    integration: Tests that require internal modules to work together
    live_llm: Tests that call out to a live LLM API (can be expensive/slow)
    slow: Tests that take a long time to run
    swarm: Tests that execute the multi-agent Swarm protocol
    frontend: Tests related to frontend or UI
    network: Tests requiring external network access (other than LLM)

addopts = -m "not live_llm and not slow" -q
testpaths = tests
pythonpath = src
